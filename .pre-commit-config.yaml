---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Enable the hooks for this repo
# > pip install --user --upgrade uv
# > uv tool install pre-commit
# > pre-commit install

# yamllint disable rule:line-length

# Completely exclude certain files from checks
# exclude: |
#   (?x)^(
#     vendor/.**|
#     dir2/.*
#   )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files  # Prevents giant files from being committed
      - id: check-json               # Check that JSON files are valid
        exclude: |
          (?x)^(
                .devcontainer/devcontainer.json
          )$
      - id: check-merge-conflict     # Check merge conflict strings
      - id: check-symlinks           # Ensure symlinks have a valid target
      - id: check-toml               # Ensure toml files are valid
      - id: check-xml                # Check that XML files are valid
      - id: debug-statements         # debugger imports and breakpoint() calls
      - id: end-of-file-fixer        # File is empty or ends with one newline
      - id: fix-byte-order-marker    # Forbid utf-8 byte order marker
      - id: trailing-whitespace      # Trims trailing whitespace
        args: [--markdown-linebreak-ext=md]
        # exclude: |
        #   (?x)^(
        #         test\.py|
        #         testdata/.*
        #     )$

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      # Forbid UTF-8 replacement character
      - id: text-unicode-replacement-char

  - repo: https://github.com/adrienverge/yamllint
    rev: "v1.38.0"
    hooks:
      # Lint yaml files
      - id: yamllint
        args: ["--strict", "-c", ".github/yamllint-config.yaml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.3"
    hooks:
      # Note: lint/fix before format
      - id: ruff-check
      # args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: "v0.23.2"
    hooks:
      - id: markdownlint-cli2
        # Use the system-installed binary instead of the hook's default
        # `language: node`. Pre-commit installs node-language hooks via
        # `npm install --allow-git=root -g git+file://...`, but npm's
        # `allow-git` config only permits git dependencies declared in an
        # existing package.json, not an ad-hoc git spec passed directly to
        # `npm install -g`. That makes npm reject the install with
        # `EALLOWGIT`. The binary is installed globally in
        # sandbox/Dockerfile and .github/workflows/ci-workflow.yaml instead.
        language: system
        args: ["--config", ".github/markdownlint-cli2.yaml"]
        exclude: |
          (?x)^(
                .github/pull_request_template.md |
                .agents/skills/
            )$

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      # Lint Dockerfiles
      - id: hadolint

  - repo: https://github.com/Mergifyio/mergify-pre-commit
    rev: "1.1.0"
    hooks:
      - id: validate-mergify-config-location
      - id: validate-mergify-config

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: "44.29.4"
    hooks:
      # Validate Renovate's configuration file
      - id: renovate-config-validator

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # Prevent secrets from being committed
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # exclude: package.lock.json

  - repo: https://gitlab.com/bmares/check-json5
    rev: "v1.0.1"
    hooks:
      # Check that JSON files are valid JSON5
      - id: check-json5

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
