[project]
name = "my-sandbox"
version = "0.1.0"
description = "Tests and tooling for my-sandbox"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: Fast isolated unit tests for CLI argument parsing and helper logic",
    "vm: Tests against a provisioned Lima guest; requires /dev/kvm",
    "recursive: Lima-in-Lima tests; requires nested KVM",
    "e2e_kind: End-to-end kind cluster tests inside a provisioned Lima VM",
    "cold_bootstrap: Cold-cache pre-commit bootstrap validation (path-gated and scheduled in CI)",
    "e2e_inference: End-to-end LLM inference tests for API providers",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
