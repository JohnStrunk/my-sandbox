[project]
name = "my-sandbox"
version = "0.1.0"
description = "Tests and tooling for my-sandbox"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-testinfra==10.2.2",
    "pytest-mock==3.15.1",
    "requests==2.34.2",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: Fast isolated unit tests for CLI argument parsing and helper logic",
    "container: Container image static and smoke verification tests",
    "integration: Integration tests for container lifecycle and nested Podman",
    "e2e_inference: End-to-end LLM inference tests (local Ollama or API providers)",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
