---
# yamllint disable rule:line-length
name: "CI Workflow"

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - main
  # Nightly full validation on main, including the cold pre-commit bootstrap
  # path that ordinary pull requests run only when their change affects it.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      kind_integration:
        description: "Run kind on a runner with delegated cgroup v2 and user namespaces"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  changes:
    name: "Detect cold bootstrap relevance"
    runs-on: ubuntu-latest
    outputs:
      cold_bootstrap: ${{ steps.filter.outputs.cold_bootstrap }}

    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"
          fetch-depth: 0

      - name: Evaluate cold bootstrap path filters
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Paths that can change how pre-commit hooks bootstrap or behave
          # inside the devbox image. Everything else keeps the fast cached
          # validation.
          relevant='^(\.pre-commit-config\.yaml|\.secrets\.baseline|\.github/workflows/|container/|pyproject\.toml|uv\.lock|scripts/sanitized-test\.sh|scripts/validate_tool_versions\.py|scripts/detect_secrets_filters\.py|tests/container/test_image_binaries\.py)'
          cold_bootstrap=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! changed="$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null)"; then
              echo "::warning::Base commit diff failed; forcing cold bootstrap."
            elif grep -Eq "$relevant" <<<"$changed"; then
              echo "Cold bootstrap requested by changed paths:"
              grep -E "$relevant" <<<"$changed"
            else
              cold_bootstrap=false
            fi
          fi
          printf 'cold_bootstrap=%s\n' "$cold_bootstrap" >> "$GITHUB_OUTPUT"
          echo "cold_bootstrap=${cold_bootstrap}" >> "$GITHUB_STEP_SUMMARY"

  pre-commit:
    name: "Pre-commit checks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The test job is the single owner of the shared setup-uv cache.
          save-cache: false

      - name: Validate tool versions
        run: python3 scripts/validate_tool_versions.py

      - name: Verify release provenance checksums
        # Recomputes the SHA-256 of every manifest-declared release asset
        # (ast-grep binaries, the official agent-skill archive, and GitHub MCP
        # server binaries) against the pinned version so a version-only
        # Renovate bump fails here instead of at image-build time. See
        # scripts/verify_provenance.py.
        run: python3 scripts/verify_provenance.py

      - name: Install pre-commit
        run: |
          pre_commit_version="$(jq -er '.tools.pre_commit.version' \
            container/tool-versions.json)"
          pre_commit_version="${pre_commit_version#v}"
          uv tool install "pre-commit==${pre_commit_version}"

      - name: Install hadolint
        run: |
          set -euo pipefail
          hadolint_version="$(jq -er '.tools.hadolint.version' \
            container/tool-versions.json)"
          hadolint_version="${hadolint_version#v}"
          hadolint_version="v${hadolint_version}"
          asset="hadolint-linux-x86_64"
          base_url="https://github.com/hadolint/hadolint/releases/download/${hadolint_version}"
          curl -sSfL -o "$asset" "${base_url}/${asset}"
          curl -sSfL -o checksums.sha256 "${base_url}/checksums.sha256"
          checksum_line="$(awk -v asset="$asset" '$2 == "*" asset { print; exit }' checksums.sha256)"
          if [ -z "$checksum_line" ]; then
            echo "No checksum found for $asset" >&2
            exit 1
          fi
          printf '%s\n' "$checksum_line" | sha256sum -c -
          rm -f checksums.sha256
          chmod +x "$asset"
          sudo mv "$asset" /usr/local/bin/hadolint

      - name: Install markdownlint-cli2
        # zizmor: ignore[adhoc-packages]
        run: |
          markdownlint_version="$(jq -er '.tools.markdownlint_cli2.version' \
            container/tool-versions.json)"
          markdownlint_version="${markdownlint_version#v}"
          npm install -g "markdownlint-cli2@${markdownlint_version}"

      - name: Enable cache for pre-commit hooks
        # https://github.com/actions/cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # yamllint disable-line rule:line-length
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|

      - name: Run pre-commit checks
        run: >-
          ./scripts/sanitized-test.sh -- env
          PRE_COMMIT_HOME="${HOME}/.cache/pre-commit" pre-commit run -a

      - name: Run pre-commit gc
        run: pre-commit gc

  test:
    name: "Automated Tests"
    needs:
      - changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Podman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends podman zstd

      - name: Determine Podman version
        id: podman-version
        run: printf 'version=%s\n' "$(podman version --format '{{.Version}}')" >> "$GITHUB_OUTPUT"

      # Rootless layers can be owned by subordinate UIDs. Archive the graph
      # root inside Podman's user namespace instead of caching it directly.
      - name: Restore Podman layer cache
        id: podman-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/podman-storage.tar.zst
          key: podman-storage-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.podman-version.outputs.version }}-${{ hashFiles('container/**') }}

      - name: Restore cached Podman layers
        if: steps.podman-cache.outputs.cache-matched-key != ''
        run: |
          set -euo pipefail
          storage="$HOME/.local/share/containers/storage"
          rm -rf "$storage"
          mkdir -p "$storage"
          podman unshare tar \
            --extract \
            --zstd \
            --numeric-owner \
            --same-owner \
            --same-permissions \
            --xattrs \
            --xattrs-include='*' \
            --acls \
            --file "$RUNNER_TEMP/podman-storage.tar.zst" \
            --directory "$storage"
          podman info --format '{{.Store.GraphRoot}}' >/dev/null

      - name: Build devbox image
        env:
          CACHE_HIT: ${{ steps.podman-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.podman-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          start_time="$(date +%s)"
          podman build --layers --file container/Dockerfile --tag devbox:latest container/
          duration="$(( $(date +%s) - start_time ))"
          cache_hit="${CACHE_HIT:-false}"
          matched_key="${CACHE_MATCHED_KEY:-none}"
          printf 'Devbox image build duration: %ss (exact cache hit: %s)\n' \
            "$duration" "$cache_hit"
          printf 'Devbox image cache restored: %s\n' "$matched_key"
          {
            printf '%s\n' '### Devbox image build'
            printf '%s\n' "- Duration: ${duration}s"
            printf '%s\n' "- Exact cache hit: ${cache_hit}"
            printf '%s\n' "- Restored cache key: ${matched_key}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Cache entries are immutable. Only update the shared cache from main;
      # pull requests can read it but cannot modify it with untrusted changes.
      - name: Archive Podman layers
        if: success() && github.ref == 'refs/heads/main' && steps.podman-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          podman unshare tar \
            --create \
            --zstd \
            --numeric-owner \
            --xattrs \
            --xattrs-include='*' \
            --acls \
            --file "$RUNNER_TEMP/podman-storage.tar.zst" \
            --directory "$HOME/.local/share/containers/storage" .

      - name: Run test suite
        # The cold_bootstrap check needs an empty hook cache to be meaningful;
        # it runs as its own gated step instead of slowing down every PR.
        run: >-
          ./scripts/sanitized-test.sh --require-podman --
          env UV_CACHE_DIR="${HOME}/.cache/uv"
          uv run --extra test pytest -m "not e2e_inference and not cold_bootstrap"

      # Reuses the image and Podman storage the test suite already built, so
      # only the network-dependent hook-environment download is repeated.
      - name: Run cold pre-commit bootstrap check
        if: needs.changes.outputs.cold_bootstrap == 'true'
        run: >-
          ./scripts/sanitized-test.sh --require-podman --
          env UV_CACHE_DIR="${HOME}/.cache/uv"
          uv run --extra test pytest -m cold_bootstrap

      - name: Save Podman layer cache
        if: success() && github.ref == 'refs/heads/main' && steps.podman-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/podman-storage.tar.zst
          key: podman-storage-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.podman-version.outputs.version }}-${{ hashFiles('container/**') }}

  kind-integration:
    name: "kind Kubernetes integration (opt-in)"
    if: github.event_name == 'workflow_dispatch' && inputs.kind_integration == true
    needs:
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          save-cache: false

      - name: Install Podman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends podman zstd

      - name: Verify delegated user scope
        run: systemd-run --scope --user -p Delegate=yes true

      - name: Run strict kind integration
        run: >-
          systemd-run --scope --user -p Delegate=yes
          ./scripts/sanitized-test.sh --require-podman --
          env DEVBOX_KIND_REQUIRE=1 UV_CACHE_DIR="${HOME}/.cache/uv"
          uv run --extra test pytest -m integration tests/integration/test_kind.py

  # This is a dummy job to determine success of the CI workflow
  ci-success:
    name: CI Workflow - Success
    if: always()
    needs:
      - changes
      - pre-commit
      - test
      - kind-integration
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
          KIND_INTEGRATION_REQUESTED: "${{ github.event_name == 'workflow_dispatch' && inputs.kind_integration == true }}"
        run: |
          for r in $RESULTS; do
            if [[ "$r" == "skipped" && "$KIND_INTEGRATION_REQUESTED" != "true" ]]; then
              continue
            fi
            if [[ "$r" != "success" ]]; then
              echo "::error::❌ One or more required jobs failed, were cancelled, or were skipped ❌"
              exit 1
            fi
          done
          echo "✅ All required jobs succeeded ✅"
