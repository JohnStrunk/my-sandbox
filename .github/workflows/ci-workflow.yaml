---
# yamllint disable rule:line-length
name: "CI Workflow"

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - main
  # Nightly full validation on main, including the cold pre-commit bootstrap
  # path that ordinary pull requests run only when their change affects it.
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read

jobs:
  changes:
    name: "Detect test-tier relevance"
    runs-on: ubuntu-latest
    outputs:
      cold_bootstrap: ${{ steps.filter.outputs.cold_bootstrap }}
      recursive: ${{ steps.filter.outputs.recursive }}

    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"
          fetch-depth: 0

      - name: Evaluate CI test-tier path filters
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Paths that can change hook bootstrap or the manifest-driven VM
          # toolchain. Everything else keeps the fast cached validation.
          relevant='^(\.pre-commit-config\.yaml|\.secrets\.baseline|\.github/workflows/|lima/|pyproject\.toml|uv\.lock|scripts/(sanitized-test\.sh|validate_tool_versions\.py|verify_provenance\.py|detect_secrets_filters\.py)|tests/unit/(test_cold_bootstrap|test_tool_versions|test_lima_toolchain|test_lima_template)\.py)'
          recursive_relevant='^(\.github/workflows/|devbox$|lima/|scripts/(sanitized-test\.sh|vm_preflight\.py|install-lima-ci\.sh|run-vm-ci\.sh|validate_tool_versions\.py)|tests/(conftest\.py|vm/|unit/(test_vm_preflight|test_vm_fixtures|test_devbox_lima|test_lima_template|test_tool_versions)\.py)|pyproject\.toml|uv\.lock)'
          cold_bootstrap=true
          recursive=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! changed="$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null)"; then
              echo "::warning::Base commit diff failed; forcing cold bootstrap."
              echo "::warning::Base commit diff failed; forcing recursive VM tests."
            elif grep -Eq "$relevant" <<<"$changed"; then
              echo "Cold bootstrap requested by changed paths:"
              grep -E "$relevant" <<<"$changed"
            else
              cold_bootstrap=false
            fi
            if [[ -n "${changed:-}" ]] && grep -Eq "$recursive_relevant" <<<"$changed"; then
              echo "Recursive VM tests requested by changed paths:"
              grep -E "$recursive_relevant" <<<"$changed"
            elif [[ -n "${changed:-}" ]]; then
              recursive=false
            fi
          fi
          printf 'cold_bootstrap=%s\n' "$cold_bootstrap" >> "$GITHUB_OUTPUT"
          printf 'recursive=%s\n' "$recursive" >> "$GITHUB_OUTPUT"
          echo "cold_bootstrap=${cold_bootstrap}" >> "$GITHUB_STEP_SUMMARY"
          echo "recursive=${recursive}" >> "$GITHUB_STEP_SUMMARY"

  pre-commit:
    name: "Pre-commit checks"
    needs:
      - changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The test job is the single owner of the shared setup-uv cache.
          save-cache: false

      - name: Validate tool versions
        run: python3 scripts/validate_tool_versions.py

      - name: Verify release provenance checksums
        # Recomputes the SHA-256 of every manifest-declared release asset and
        # skill archive, so version-only Renovate bumps fail here instead of
        # during VM provisioning.
        run: python3 scripts/verify_provenance.py

      - name: Install pre-commit
        run: |
          pre_commit_version="$(jq -er '.tools.pre_commit.version' \
            lima/tool-versions.json)"
          pre_commit_version="${pre_commit_version#v}"
          uv tool install "pre-commit==${pre_commit_version}"

      - name: Install markdownlint-cli2
        # zizmor: ignore[adhoc-packages]
        run: |
          markdownlint_version="$(jq -er '.tools.markdownlint_cli2.version' \
            lima/tool-versions.json)"
          markdownlint_version="${markdownlint_version#v}"
          npm install -g "markdownlint-cli2@${markdownlint_version}"

      - name: Enable cache for pre-commit hooks
        # https://github.com/actions/cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # yamllint disable-line rule:line-length
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|

      - name: Run pre-commit checks
        run: >-
          ./scripts/sanitized-test.sh -- env
          PRE_COMMIT_HOME="${HOME}/.cache/pre-commit" pre-commit run -a

      - name: Install test dependencies for cold hook bootstrap
        if: needs.changes.outputs.cold_bootstrap == 'true'
        run: uv sync --extra test

      - name: Run cold pre-commit bootstrap check
        if: needs.changes.outputs.cold_bootstrap == 'true'
        run: >-
          ./scripts/sanitized-test.sh --
          uv run --extra test pytest -m cold_bootstrap

      - name: Run pre-commit gc
        run: pre-commit gc

  test:
    name: "Automated Tests"
    needs:
      - changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Run unit tests
        run: >-
          ./scripts/sanitized-test.sh --
          env UV_CACHE_DIR="${HOME}/.cache/uv"
          uv run --extra test pytest -m unit

  vm:
    name: "VM Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Install pinned Lima
        run: ./scripts/install-lima-ci.sh

      - name: Run provisioned-VM and kind tests
        run: |
          set +e
          python3 -I scripts/vm_preflight.py
          preflight_status=$?
          set -e
          if [[ "$preflight_status" -eq 125 ]]; then
            echo "### VM tier skipped: host KVM is unavailable" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [[ "$preflight_status" -ne 0 ]]; then
            exit "$preflight_status"
          fi
          ./scripts/run-vm-ci.sh vm

  recursive-vm:
    name: "Recursive VM Tests"
    needs:
      - changes
    runs-on: ubuntu-latest

    steps:
      - name: Explain path-gated skip
        if: needs.changes.outputs.recursive != 'true'
        run: echo "No recursive-VM-relevant paths changed; nightly CI always runs this tier."

      - name: Checkout repository
        if: needs.changes.outputs.recursive == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU and UEFI firmware
        if: needs.changes.outputs.recursive == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Install pinned Lima
        if: needs.changes.outputs.recursive == 'true'
        run: ./scripts/install-lima-ci.sh

      - name: Run Lima-in-Lima test
        if: needs.changes.outputs.recursive == 'true'
        run: |
          set +e
          python3 scripts/vm_preflight.py --recursive
          preflight_status=$?
          set -e
          if [[ "$preflight_status" -eq 125 ]]; then
            echo "### Recursive VM tier skipped: host nested KVM is unavailable" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [[ "$preflight_status" -ne 0 ]]; then
            exit "$preflight_status"
          fi
          ./scripts/run-vm-ci.sh recursive

  # This is a dummy job to determine success of the CI workflow
  ci-success:
    name: CI Workflow - Success
    if: always()
    needs:
      - changes
      - pre-commit
      - test
      - vm
      - recursive-vm
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
        run: |
          for r in $RESULTS; do
            if [[ "$r" != "success" ]]; then
              echo "::error::❌ One or more required jobs failed, were cancelled, or were skipped ❌"
              exit 1
            fi
          done
          echo "✅ All required jobs succeeded ✅"
