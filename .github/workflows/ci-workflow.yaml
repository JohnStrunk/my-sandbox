---
# yamllint disable rule:line-length
name: "CI Workflow"

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: "Pre-commit checks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Install hadolint
        # Version must match the hadolint rev in .pre-commit-config.yaml
        env:
          HADOLINT_VERSION: "v2.14.0"
        run: |
          set -euo pipefail
          asset="hadolint-linux-x86_64"
          base_url="https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}"
          curl -sSfL -o "$asset" "${base_url}/${asset}"
          curl -sSfL -o "${asset}.sha256" "${base_url}/${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          chmod +x "$asset"
          sudo mv "$asset" /usr/local/bin/hadolint

      - name: Install markdownlint-cli2
        # Version must match the markdownlint-cli2 rev in
        # .pre-commit-config.yaml. Its pre-commit hook uses
        # `language: system` and runs this binary directly, since npm's
        # `allow-git` config rejects the hook's default `language: node`
        # install command (`npm install --allow-git=root -g
        # git+file://...`) with EALLOWGIT.
        # zizmor: ignore[adhoc-packages]
        run: npm install -g markdownlint-cli2@0.23.0

      - name: Enable cache for pre-commit hooks
        # https://github.com/actions/cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # yamllint disable-line rule:line-length
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|

      - name: Run pre-commit checks
        run: pre-commit run -a

      - name: Run pre-commit gc
        run: pre-commit gc

  # This is a dummy job to determine success of the CI workflow
  ci-success:
    name: CI Workflow - Success
    if: always()
    needs:
      - pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
        run: |
          for r in $RESULTS; do
            if [[ "$r" != "success" ]]; then
              echo "::error::❌ One or more required jobs failed, were cancelled, or were skipped ❌"
              exit 1
            fi
          done
          echo "✅ All required jobs succeeded ✅"
