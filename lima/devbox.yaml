---
# Lima template for the "devbox" VM: a minimal, VM-native development
# environment for my-sandbox. See lima/README.md for host prerequisites,
# the create command, and day-to-day usage.
#
# The instance name ("devbox") derives from this template's filename:
#   limactl start ~/src/my-sandbox/lima/devbox.yaml
#
# Design notes:
# - Same-path mounts: each host directory is mounted in the guest at its
#   literal host path (Lima's default mountPoint), so the absolute .git
#   pointers of linked Git worktrees (written on the host) resolve
#   unchanged inside the VM. The guest user's home (/home/<user>.guest,
#   Lima's default) stays VM-local; provision-user.sh symlinks the shared
#   paths into it.
# - The guest user mirrors the host user (same name and uid, Lima's
#   default on Linux hosts), so files written through the mounts are
#   owned by the host user.
# - Lima's own boot scripts already provide the rootless-Podman base
#   (/etc/subuid and /etc/subgid entries, cgroup delegation, linger);
#   provisioning only installs Podman itself, and probe-readiness.sh
#   verifies all of it.

# 2.1.3 is the floor for the CVE-2026-53657 guest-agent fix
# (GHSA-2j9v-p4xj-cjw2). Everything this template uses exists in 2.1.3.
minimumLimaVersion: "2.1.3"

# QEMU with KVM acceleration. Nested virtualization comes from Lima's
# default "host" CPU model on Linux/KVM, which exposes VMX/SVM to the
# guest; do not override cpuType. The explicit nestedVirtualization flag
# is currently inert under the qemu driver in Lima <= 2.2 (it is honored
# from Lima 2.3 on, where it also fails fast when the host KVM module has
# nesting disabled); probe-readiness.sh verifies VMX/SVM exposure in the
# guest either way.
vmType: "qemu"
nestedVirtualization: true

# Headroom for L2 test VMs and kind clusters (issue asks for 6-8 CPUs).
cpus: 8
memory: "16GiB"
disk: "100GiB"

# Fedora 44 cloud images, digest-pinned to the same digests Lima's own
# templates/_images/fedora-44.yaml pins. Refresh both together.
images:
  - location: "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
    arch: "x86_64"
    digest: "sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
  - location: "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/aarch64/images/Fedora-Cloud-Base-Generic-44-1.7.aarch64.qcow2"
    arch: "aarch64"
    digest: "sha256:55c60a3b80d3616a08705afd0459e75fe9f03c54aba7a46e4002a41a72fa0d5b"

# 9p is Lima's Linux-host default and needs no extra guest packages.
# virtiofs is evaluated separately (issue #268).
mountType: "9p"

# Static same-path mounts. Never mount all of $HOME: only the paths the
# devbox shares with the host. All are writable. The qemu driver creates
# any missing host directories.
mounts:
  # Projects root (worktrees live under ~/src/my-sandbox/.worktrees/)
  - location: "~/src"
    writable: true
  # Knowledge base (kbase.py sync runs from the VM)
  - location: "~/kb"
    writable: true
  # Agent skills (the devbox-tools skill is staged into ~/.agents/skills)
  - location: "~/.agents"
    writable: true
  # OpenCode config and session data are shared with the host; volatile
  # state (~/.local/state/opencode) stays VM-local (single service owner).
  - location: "~/.config/opencode"
    writable: true
  - location: "~/.local/share/opencode"
    writable: true
  # Credential/config passthrough.
  - location: "~/.config/gh"
    writable: true
  # Lima can only mount directories, so the gcloud ADC *file* is covered
  # by mounting its parent directory instead.
  - location: "~/.config/gcloud"
    writable: true
  - location: "~/.config/acli"
    writable: true
  - location: "~/.config/gws"
    writable: true

# Podman (installed by provisioning) is the container runtime; disable
# Lima's containerd so no docker/nerdctl machinery is installed.
containerd:
  system: false
  user: false

# One-time Git identity seeding, passed at create time:
#   --param GitUserName="$(git config --global user.name)"
#   --param GitUserEmail="$(git config --global user.email)"
# provision-user.sh reads them as $PARAM_GitUserName / $PARAM_GitUserEmail
# and only fills in the VM's global Git config when unset.
param:
  GitUserName: ""
  GitUserEmail: ""

# Idempotent provisioning; scripts re-run on every VM start. Lima embeds
# the files (resolved relative to this template) into the instance, so
# changes require recreating the instance (see lima/README.md).
provision:
  # Root: packages, kvm group, pinned OpenCode and limactl.
  - mode: system
    file: provision-system.sh
  # User: symlinks, Git identity, gh setup, pinned uv, skill staging.
  - mode: user
    file: provision-user.sh

probes:
  - mode: readiness
    description: "devbox tools, rootless-Podman base, same-path mounts"
    # Lima requires a probe's script to be embedded inline. Keep this copy in
    # sync with probe-readiness.sh; test_lima_template.py checks the match.
    script: |
      #!/bin/bash
      # Readiness probe for the devbox Lima VM. Lima runs probes over SSH as
      # the devbox user (no login shell), so tool paths are absolute.
      # A failing probe makes `limactl start` report the VM as not ready.
      set -euo pipefail

      fail() {
        echo "devbox readiness: $*" >&2
        exit 1
      }

      # Tools installed by provision-system.sh / provision-user.sh.
      test -x /usr/bin/git || fail "git is not installed"
      test -x /usr/bin/gh || fail "gh is not installed"
      test -x /usr/bin/podman || fail "podman is not installed"
      test -x /usr/local/bin/opencode || fail "opencode is not installed"
      test -x /usr/local/bin/limactl || fail "limactl is not installed"
      test -x "${HOME}/.local/bin/uv" || fail "uv is not installed"

      # Nested virtualization. With -cpu host the guest only sees the vmx/svm
      # CPU flag when the host KVM module exposes nesting, so this is the real
      # guard for L2 VM support on x86_64. (Lima <= 2.2 does not itself fail
      # when host nesting is disabled.) aarch64 has no equivalent flag; the L2
      # boot test in lima/README.md's checklist covers it.
      test -e /dev/kvm \
        || fail "/dev/kvm is missing (host nested virtualization?)"
      case "$(uname -m)" in
        x86_64)
          grep -qm1 -w vmx /proc/cpuinfo \
            || fail \
              "no vmx CPU flag: host nested virtualization is off" \
              "(kvm_intel nested=0?)"
          ;;
      esac
      getent group kvm | grep -qw "$(id -un)" \
        || fail "the devbox user is not in the kvm group"

      # Rootless Podman base (configured by Lima's 20-rootless-base.sh).
      grep -q "^$(id -un):" /etc/subuid \
        || fail "/etc/subuid has no entry for $(id -un)"
      grep -q "^$(id -un):" /etc/subgid \
        || fail "/etc/subgid has no entry for $(id -un)"

      # Same-path 9p mounts (keep in sync with the mounts in devbox.yaml).
      for rel in \
        .agents \
        .config/acli \
        .config/gcloud \
        .config/gh \
        .config/gws \
        .config/opencode \
        .local/share/opencode \
        kb \
        src
      do
        findmnt -rn -t 9p -o TARGET | grep -xq -- ".*/${rel}" \
          || fail "the 9p mount for '~/${rel}' is not live"
        # provision-user.sh links each shared path into the guest home; a real
        # (non-symlink) path here means the sharing setup did not run through.
        test -L "${HOME}/${rel}" \
          || fail "'~/${rel}' is not a symlink to its 9p mount (provisioning?)"
      done

      # OpenCode's volatile state must stay VM-local, never host-shared.
      if [ -L "${HOME}/.local/state/opencode" ]; then
        fail \
          "OpenCode state dir (.local/state/opencode) must stay VM-local:" \
          "it must not be a symlink"
      fi

message: |
  # The devbox VM is ready.
  # Log in with provider env: ~/src/my-sandbox/lima/devbox-shell (on the host)
  # Agent session:  cd ~/src/my-sandbox && opencode   (inside the VM)
  # Full docs:      lima/README.md in the my-sandbox repository.
